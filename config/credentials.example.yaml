# vksinspect credentials — SEPARATE from the environment config, on purpose.
#
#   - Credentials never appear in the environment config YAML.
#   - Credentials never appear in a report, a baseline, or a log line.
#   - This file must be mode 0600. vksinspect refuses to read it otherwise.
#   - Everything here can be supplied by environment variable instead, which
#     takes precedence:
#
#       VKSINSPECT_VCENTER_USERNAME   VKSINSPECT_VCENTER_PASSWORD
#       VKSINSPECT_NSX_USERNAME       VKSINSPECT_NSX_PASSWORD
#       VKSINSPECT_ALB_USERNAME       VKSINSPECT_ALB_PASSWORD
#       VKSINSPECT_HAPROXY_USERNAME   VKSINSPECT_HAPROXY_PASSWORD
#
#     The key after the prefix is the credentialRef from the config, uppercased.
#
# Copy to credentials.yaml (git-ignored), chmod 0600, and fill in.
#
# The account used should be read-only. vksinspect performs no writes; giving it
# an administrative account grants access it does not need and cannot use.

apiVersion: vksinspect/v1alpha1
kind: Credentials

credentials:
  vcenter:
    username: readonly@vsphere.local
    password: ""
    # caCertFile: /etc/vksinspect/vcenter-ca.pem
    # insecureSkipVerify: true
    #   Disables TLS verification for this endpoint only. Any certificate check
    #   against it is then downgraded to informational and says why — an
    #   unverified connection cannot evidence a valid chain.

  nsx:
    username: readonly
    password: ""

  # alb:
  #   username: readonly
  #   password: ""

  # haproxy:
  #   username: readonly
  #   password: ""
